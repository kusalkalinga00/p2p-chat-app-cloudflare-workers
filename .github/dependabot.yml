version: 2
updates:
  # pnpm workspaces are covered by the npm ecosystem.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the toolchain, so a security bump is not drowned out by noise.
      build-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
    ignore:
      # drei 10.7.8 and 10.7.9 break troika's text worker in a production build:
      # "init did not return a callable function", which unmounts the whole
      # scene and leaves a blank canvas. 10.7.7 renders. Drop this once a later
      # version is confirmed working.
      - dependency-name: "@react-three/drei"
        versions: ["10.7.8", "10.7.9"]

  # Keeps CI actions pinned to fresh commit SHAs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

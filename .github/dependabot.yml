version: 2
updates:
  # pnpm workspaces are covered by the npm ecosystem.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the toolchain, so a security bump is not drowned out by noise.
      build-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
    # @react-three/drei is pinned to 10.7.7 in apps/client: 10.7.8/10.7.9 changed
    # its troika text path, which blanked the scene. The app no longer uses
    # troika (labels are DOM), so a bump is worth re-evaluating by hand rather
    # than ignoring outright — the pin in package.json holds it until then.

  # Keeps CI actions pinned to fresh commit SHAs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

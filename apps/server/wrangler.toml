name = "p2p-chat-server"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

# One instance per client IP, used to rate limit GET /ice.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "IceRateLimiter"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["World"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["IceRateLimiter"]

[observability]
[observability.logs]
enabled = false
invocation_logs = true

# ---------------------------------------------------------------------------
# TURN / ICE configuration (all optional)
# ---------------------------------------------------------------------------
# The Worker serves GET /ice, which the browser uses to build its
# RTCPeerConnection. Credentials are resolved server-side so nothing secret
# ships in the client bundle.
#
# Option A — Metered Open Relay: free, no payment method needed.
#   (1) sign up at https://www.metered.ca/ (free account, email only)
#   (2) left nav -> Developers -> copy the Secret key
#   (3) wrangler secret put METERED_SECRET_KEY
#       wrangler secret put METERED_APP         # island-chat, or the full
#                                               # island-chat.metered.live
# The Worker creates a short-lived credential, resolves its ICE servers, and
# caches them. Note: new credentials can take up to 2 minutes to propagate
# across Metered's network, which is why the client prefetches on connect
# rather than at call setup.
#
# Option B — Cloudflare TURN (requires billing enabled on the account):
#
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_KEY_API_TOKEN
#
# Create the key at https://dash.cloudflare.com/?to=/:account/calls. Optionally
# set TURN_TTL_SECONDS (default 86400). TURN is billed at $0.05/GB outbound
# unless used with the Realtime SFU.
#
# Local development — coturn in Docker (see infra/turn/). Either put the vars
# below in [vars] for `wrangler dev`, or pass them per run:
#
#   wrangler dev --var TURN_URLS:"turn:192.168.1.20:3478?transport=udp" \
#                --var TURN_USERNAME:island --var TURN_PASSWORD:islanddev
#
# [vars]
# TURN_URLS = "turn:192.168.1.20:3478?transport=udp"
# TURN_USERNAME = "island"
# TURN_PASSWORD = "islanddev"
#
# Allowed browser origins for CORS (comma separated). Defaults to localhost
# and the production Pages domain when unset. Also the allowlist that /ice
# checks before minting credentials.
# ALLOWED_ORIGINS = "http://localhost:5180,https://example.pages.dev"
#
# /ice rate limiting, per client IP. Defaults: 30 requests per 3600 seconds.
# Only applies when a TURN provider is configured.
# ICE_RATE_LIMIT = "30"
# ICE_RATE_WINDOW_SECONDS = "3600"

packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  workerd: true

# Force the patched minimatch for consumers that were pinned to a vulnerable
# major. Scoped by range so the v3 copies (still used by other tooling) are
# left alone.
overrides:
  minimatch@>=10.0.0 <11.0.1: ^11.0.1

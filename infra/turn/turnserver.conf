# coturn with long-term credentials, for local TURN testing only.
# Never use these credentials outside localhost.
listening-port=3478
listening-ip=0.0.0.0

# Long-term credential mechanism (username / password).
# The credential itself is passed on the command line by docker-compose.yml
# (TURN_USER / TURN_PASS) so no password is ever committed. Never add a
# `user=` line here.
lt-cred-mech
realm=island.test

# Relay port range. Must match the published range in docker-compose.yml.
min-port=49160
max-port=49200

# external-ip is NOT set here: docker-compose.yml passes it on the command
# line (override with TURN_EXTERNAL_IP). It must be an address peers can reach;
# left unset, coturn advertises its container IP, which neither the host
# browser nor a relay-to-relay hairpin can route to.

# coturn refuses to relay to private peers by default (SSRF protection).
# Every peer in this setup is private (host LAN + docker subnet), so both are
# allowed explicitly. This is why this config is local-testing only.
allowed-peer-ip=192.168.20.0-192.168.20.255
allowed-peer-ip=172.25.0.0-172.25.255.255
allowed-peer-ip=127.0.0.0-127.255.255.255

fingerprint
verbose
no-cli
